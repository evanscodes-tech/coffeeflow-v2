{% extends "base.html" %}

{% block title %}Login - CoffeeFlow{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="form-title">☕ Welcome Back</h1>
    
    <form method="post" novalidate>
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="alert alert-error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}
        
        <div class="form-group">
            <label for="id_username">Username:</label>
            <input type="text" name="username" id="id_username" required>
        </div>
        
        <div class="form-group">
            <label for="id_password">Password:</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 16px;">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(139, 90, 43, 0.1);">
        <p style="color: var(--text-light);">
            Don't have an account? <a href="/accounts/register/" style="color: var(--primary); font-weight: 600; text-decoration: none;"><i class="fas fa-user-plus"></i> Create one</a>
        </p>
    </div>
</div>
{% endblock %}
