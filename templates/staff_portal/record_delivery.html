{% extends "base.html" %}
{% load static %}

{% block title %}Record Delivery - CoffeeFlow{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1><i class="fas fa-truck"></i> Record Coffee Delivery</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label><i class="fas fa-user"></i> Farmer:</label><br>
            <select name="farmer_id" required style="width: 100%; padding: 8px;">
                <option value="">-- Select Farmer --</option>
                {% for farmer in farmers %}
                <option value="{{ farmer.id }}">{{ farmer.full_name }} - {{ farmer.farm_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label><i class="fas fa-weight-hanging"></i> Cherry Weight (kg):</label><br>
            <input type="number" step="0.1" name="cherry_weight_kg" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label><i class="fas fa-star"></i> Quality Grade:</label><br>
            <select name="quality_grade" style="width: 100%; padding: 8px;">
                <option value="specialty">⭐ Specialty</option>
                <option value="premium">✨ Premium</option>
                <option value="standard" selected>✓ Standard</option>
                <option value="commercial">📦 Commercial</option>
            </select>
        </div>
        
        <button type="submit" style="background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            <i class="fas fa-save"></i> Save Delivery
        </button>
        <a href="{% url 'staff_portal:dashboard' %}" style="margin-left: 10px;"><i class="fas fa-times"></i> Cancel</a>
    </form>
</div>
{% endblock %}
