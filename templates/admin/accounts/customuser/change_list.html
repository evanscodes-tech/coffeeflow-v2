{% extends "admin/change_list.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* ===== STYLE THE USER LIST PAGE ===== */

    /* Content area */
    #content {
        background: #ffffff !important;
        border-radius: 8px !important;
        padding: 25px !important;
        border: 1px solid #d6cec0 !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
    }

    /* Table */
    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff !important;
    }

    th {
        background: #e8e0d5 !important;
        color: #1a2a3a !important;
        font-weight: 600 !important;
        padding: 10px 14px !important;
        border: 1px solid #d6cec0 !important;
        text-align: left !important;
    }

    td {
        padding: 10px 14px !important;
        border: 1px solid #d6cec0 !important;
        background: #ffffff !important;
        color: #1a1a1a !important;
    }

    /* ===== FIX USERNAME COLOR ===== */
    td a {
        color: #1a1a1a !important;  /* Black text */
        text-decoration: none !important;
        font-weight: 500 !important;
        background: transparent !important;
    }

    td a:hover {
        color: #2c5f3e !important;  /* Green on hover */
        text-decoration: underline !important;
    }

    /* Fix any dark background on username cells */
    td.field-username {
        background: #ffffff !important;
    }

    tr:nth-child(even) td.field-username {
        background: #f8f5f0 !important;
    }

    tr:nth-child(even) td {
        background: #f8f5f0 !important;
    }

    tr:hover td {
        background: #f0ebe3 !important;
    }

    /* Breadcrumbs */
    .breadcrumbs {
        background: #f0ebe3 !important;
        color: #1a2a3a !important;
        padding: 10px 18px !important;
        border-bottom: 1px solid #d6cec0 !important;
        border-radius: 6px 6px 0 0 !important;
    }

    .breadcrumbs a {
        color: #1a2a3a !important;
        text-decoration: none !important;
    }

    .breadcrumbs a:hover {
        color: #2c5f3e !important;
        text-decoration: underline !important;
    }

    /* Object tools (Add button) */
    .object-tools a {
        background: #2c5f3e !important;
        color: white !important;
        padding: 6px 14px !important;
        border-radius: 4px !important;
        text-decoration: none !important;
        font-weight: 500 !important;
    }

    .object-tools a:hover {
        background: #1e452b !important;
    }

    /* Search bar */
    #searchbar {
        border: 1px solid #d6cec0 !important;
        border-radius: 4px !important;
        padding: 6px 12px !important;
        min-height: 38px !important;
        background: #ffffff !important;
        color: #1a1a1a !important;
    }

    #searchbar:focus {
        border-color: #8b6b4d !important;
        box-shadow: 0 0 0 2px rgba(139, 107, 77, 0.2) !important;
    }

    /* Buttons */
    .button, input[type="submit"] {
        background: #2c5f3e !important;
        color: white !important;
        border: none !important;
        padding: 6px 16px !important;
        border-radius: 4px !important;
        cursor: pointer !important;
        font-weight: 500 !important;
    }

    .button:hover, input[type="submit"]:hover {
        background: #1e452b !important;
    }

    /* Pagination */
    .paginator {
        background: #f8f5f0 !important;
        padding: 10px 16px !important;
        border-top: 1px solid #d6cec0 !important;
        border-radius: 0 0 6px 6px !important;
        color: #1a2a3a !important;
    }

    .paginator a {
        color: #2c5f3e !important;
    }

    .paginator a:hover {
        color: #1e452b !important;
    }

    /* Filter sidebar */
    #changelist-filter {
        background: #f8f5f0 !important;
        border: 1px solid #d6cec0 !important;
        border-radius: 6px !important;
        padding: 12px !important;
    }

    #changelist-filter h2 {
        background: #f0ebe3 !important;
        color: #1a2a3a !important;
        padding: 8px 12px !important;
        border-bottom: 1px solid #d6cec0 !important;
        font-size: 14px !important;
        font-weight: 600 !important;
    }

    #changelist-filter a {
        color: #1a1a1a !important;
        text-decoration: none !important;
    }

    #changelist-filter a:hover {
        color: #2c5f3e !important;
        text-decoration: underline !important;
    }

    /* Action select dropdown */
    #changelist select {
        border: 1px solid #d6cec0 !important;
        border-radius: 4px !important;
        padding: 4px 8px !important;
        min-height: 38px !important;
        background: #ffffff !important;
        color: #1a1a1a !important;
    }
</style>
{% endblock %}
