{% extends "base.html" %}
{% load static %}

{% block title %}Analytics Dashboard - CoffeeFlow{% endblock %}

{% block content %}
<div style="padding: 20px;">
    <h1>Analytics Dashboard</h1>
    
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="totalFarmers">0</div>
            <div>Total Farmers</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="totalDeliveries">0</div>
            <div>Total Deliveries</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="totalKgs">0</div>
            <div>Total Kgs</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="totalPayments">0</div>
            <div>Total Payments</div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="todayKgs">0</div>
            <div>Today's Kgs</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="seasonKgs">0</div>
            <div>Season Total</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="maleFarmers">0</div>
            <div>Male Farmers</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 2rem; font-weight: bold; color: #8B5A2B;" id="femaleFarmers">0</div>
            <div>Female Farmers</div>
        </div>
    </div>
</div>

<script>
    // SIMPLE STATS LOADER
    fetch('/reports/api/stats/')
        .then(response => response.json())
        .then(data => {
            console.log('Data:', data);
            document.getElementById('totalFarmers').innerText = data.total_farmers;
            document.getElementById('totalDeliveries').innerText = data.total_deliveries;
            document.getElementById('totalKgs').innerText = data.total_kgs.toFixed(0);
            document.getElementById('totalPayments').innerText = data.total_payments;
            document.getElementById('todayKgs').innerText = data.today_kgs.toFixed(0);
            document.getElementById('seasonKgs').innerText = data.season_kgs.toFixed(0);
            document.getElementById('maleFarmers').innerText = data.male_farmers || 0;
            document.getElementById('femaleFarmers').innerText = data.female_farmers || 0;
        });
</script>
{% endblock %}
